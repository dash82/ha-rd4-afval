name: Validate and release

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege by default; only the release job gets write access.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  release:
    # Publish a release when manifest.json carries a version that has no release yet.
    needs: [hassfest, hacs, tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Create release if the version is new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(jq -r .version custom_components/rd4_afval/manifest.json)"
          if gh release view "v${version}" >/dev/null 2>&1; then
            echo "v${version} already released, nothing to do"
          else
            gh release create "v${version}" --target "${GITHUB_SHA}" \
              --title "v${version}" --generate-notes
          fi
